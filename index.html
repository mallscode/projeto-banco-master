<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Banco Master</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="style.css">
</head>

<body class="fundo bg-dark">

    <header>
        <nav class="navbar navbar-expand-lg bg-body-tertiary p-4">
            <div class="container-fluid">
                <a class="navbar-brand" href="#">Banco Master</a>
                <button class="navbar-toggler" type="button" data-bs-toggle="collapse"
                    data-bs-target="#navbarSupportedContent" aria-controls="navbarSupportedContent"
                    aria-expanded="false" aria-label="Toggle navigation">
                    <span class="navbar-toggler-icon"></span>
                </button>
                <div class="collapse navbar-collapse" id="navbarSupportedContent">
                    <ul class="navbar-nav me-auto mb-2 mb-lg-0">
                        <li class="nav-item">
                            <a class="nav-link active" aria-current="page" href="#">Página inicial</a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link" href="#"></a>
                        </li>
                        <li class="nav-item dropdown">
                            <a class="nav-link dropdown-toggle" href="#" role="button" data-bs-toggle="dropdown"
                                aria-expanded="false">
                                Dropdown
                            </a>
                            <ul class="dropdown-menu">
                                <li><a class="dropdown-item" href="#">Action</a></li>
                                <li><a class="dropdown-item" href="#">Another action</a></li>
                                <li>
                                    <hr class="dropdown-divider">
                                </li>
                                <li><a class="dropdown-item" href="#">Something else here</a></li>
                            </ul>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link disabled" aria-disabled="true">Disabled</a>
                        </li>
                    </ul>
                    <form class="d-flex" role="search">
                        <input class="form-control me-2" type="search" placeholder="Search" aria-label="Search" />
                        <button class="btn btn-outline-success" type="submit">Search</button>
                    </form>
                </div>
            </div>
        </nav>
    </header>



    <div class="container">
        <div class="container">

            <form class="formulario px-5 py-5 mt-4" action="sucesso.html" method="get">

                <h3 class="mb-3">Começe a explorar a sua vida financeira conosco!</h3>

                <h5 class="mb-3">Entrar na conta</h5>

                <div class="mb-2">
                    <input type="text" id="nome" name="nome" placeholder="Nome" maxlength="50" class="bloco-input">
                </div>

                <div class="mb-2">
                    <input type="text" id="cpf" name="cpf" placeholder="000.000.000-00" inputmode="numeric"
                        maxlength="14" pattern="\d{3}\.\d{3}\.\d{3}-\d{2}" class="bloco-input">

                    <div class="form-text text-white">
                        Seu CPF não será compartilhado para terceiros.
                    </div>
                </div>

                <div class="mb-2">
                    <input type="password" id="password" placeholder="Insira uma senha" class="bloco-input">

                    <div class="form-text text-white">
                        Crie uma senha forte.
                    </div>
                </div>

                <div class="mb-2 form-check">
                    <input type="checkbox" class="form-check-input" id="mostrarSenha">

                    <label class="form-check-label" for="mostrarSenha">
                        Mostrar senha
                    </label>
                </div>

                <button type="submit" class="btn btn-outline-success">
                    Entrar
                </button>

            </form>

        </div>


    </div>

    <footer>

    </footer>


    <script>
        const senha = document.getElementById('password');
        const showPassword = document.getElementById('mostrarSenha');

        showPassword.addEventListener('change', function () {
            if (this.checked) {
                senha.type = 'text';
            } else {
                senha.type = 'password';
            }
        });

        const formulario = document.querySelector('.formulario');

        formulario.addEventListener('submit', function (event) {
            const nome = document.getElementById('nome').value.trim();
            const cpf = document.getElementById('cpf').value.trim();
            const senha = document.getElementById('password').value.trim();

            if (nome === '' || cpf === '' || senha === '') {
                event.preventDefault();
                alert('Preencha todos os campos!');
            }
        });
    </script>
</body>

</html>
