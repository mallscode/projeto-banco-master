<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Banco Master - Movimentações da Conta</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="style.css">
</head>

<body class="fundo">

    <aside class="barra-lateral">

        <div class="logo">
            Banco Master
        </div>

        <nav>
            <a href="contacorrente.html">Conta Corrente</a>
            <a href="movimentacoes.html" class="ativo">Movimentações</a>
            <a href="poupanca.html">Poupança</a>
        </nav>

        <a href="index.html" class="sair">Sair</a>

    </aside>


    <main class="conteudo">

        <h1>Movimentações da conta</h1>
        <p class="subtitulo">Confira todas as operações realizadas em sua conta.</p>
        <h6 id="statusMovimentacao">Nenhuma movimentação realizada ainda.</h6>

        <div class="container">
            <div class="row">
                <div class="col-6">
                    <div id="listaMovimentacoes" class="lista-movimentacoes">
                    
                    </div>
                </div>
                <div class="col-6">
                    
                </div>
            </div>
        </div>



    </main>

    <script>

        let movimentacoes = JSON.parse(localStorage.getItem("movimentacoes")) || [];
        const statusMovimentacao = document.getElementById("statusMovimentacao");
        if (movimentacoes.length > 0){
            statusMovimentacao.innerText = '';
        }

        const lista = document.getElementById("listaMovimentacoes");

        movimentacoes.forEach(function (movimentacao) {

            lista.innerHTML += `
            <div class="objetos-lista-movimentacoes">
                <strong>${movimentacao.tipo}</strong>
                <span>${movimentacao.data}</span>
                <span>R$ ${movimentacao.valor.toFixed(2).replace(".", ",")}</span>
            </div>
        `;

        });

    </script>
</body>

</html>
